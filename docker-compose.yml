version: '3.8'

services:
  seim-server:
    image: node:18-alpine
    container_name: seim-server
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/siem
      - JWT_SECRET=your-super-secret-jwt-key-change-this
    volumes:
      - .:/app
    depends_on:
      - mongodb
    networks:
      - siem-network

  mongodb:
    image: mongo:5.0
    container_name: siem-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=siem
    volumes:
      - mongodb_data:/data/db
    networks:
      - siem-network

  linux-collector:
    image: ubuntu:22.04
    container_name: siem-linux-collector
    working_dir: /app
    environment:
      - SIEM_SERVER=http://seim-server:5000
      - COLLECTOR_NAME=linux-collector-01
      - COLLECTOR_TYPE=Linux Server
    volumes:
      - ./collectors/linux-collector.sh:/app/collector.sh:ro
    networks:
      - siem-network
    command: /bin/bash /app/collector.sh
    profiles:
      - collectors

networks:
  siem-network:
    driver: bridge

volumes:
  mongodb_data:
