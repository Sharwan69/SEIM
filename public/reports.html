<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports & Export - SEIM</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111827;
        --line: #1f2937;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --success: #22c55e;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 24px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .back-btn {
        background: var(--muted);
        border: none;
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
      }
      .panel h3 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 16px;
      }
      .form-group {
        margin-bottom: 16px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 14px;
      }
      input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0f172a;
        color: var(--text);
        font-size: 14px;
      }
      input:focus, select:focus {
        outline: none;
        border-color: var(--primary);
      }
      button {
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        background: var(--primary);
        color: white;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
        width: 100%;
      }
      button:hover {
        background: #2563eb;
      }
      .export-btn {
        background: var(--success);
        margin-top: 8px;
      }
      .export-btn:hover {
        background: #16a34a;
      }
      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 16px;
      }
      .stat-box {
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }
      .stat-label {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .stat-value {
        font-size: 20px;
        font-weight: bold;
        color: var(--primary);
      }
      .severity-box {
        display: flex;
        justify-content: space-between;
        padding: 12px;
        background: rgba(59, 130, 246, 0.1);
        border-radius: 8px;
        margin-top: 8px;
      }
      .severity-item {
        text-align: center;
      }
      .severity-label {
        font-size: 11px;
        color: var(--muted);
      }
      .severity-count {
        font-size: 16px;
        font-weight: bold;
        margin-top: 4px;
      }
      .critical { color: #fca5a5; }
      .high { color: #fdba74; }
      .medium { color: #fcd34d; }
      .low { color: #86efac; }
      .message {
        padding: 12px;
        border-radius: 8px;
        margin-top: 12px;
        font-size: 14px;
      }
      .message.success {
        background: rgba(34, 197, 94, 0.2);
        color: #86efac;
      }
      .message.error {
        background: rgba(239, 68, 68, 0.2);
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <button class="back-btn" onclick="window.history.back()">← Back</button>
        <h1>Reports & Export</h1>
        <div></div>
      </div>

      <div class="grid">
        <!-- Report Generator -->
        <div class="panel">
          <h3>Generate Report</h3>
          <div class="form-group">
            <label>Start Date</label>
            <input id="startDate" type="date" />
          </div>
          <div class="form-group">
            <label>End Date</label>
            <input id="endDate" type="date" />
          </div>
          <button onclick="generateReport()">Generate Report</button>
          <div id="reportMessage"></div>
        </div>

        <!-- Export Options -->
        <div class="panel">
          <h3>Export Data</h3>
          <button class="export-btn" onclick="exportIncidents()">📥 Export Incidents (CSV)</button>
          <button class="export-btn" onclick="exportAlerts()">📥 Export Alerts (CSV)</button>
          <button class="export-btn" onclick="exportEvents()">📥 Export Events (CSV)</button>
          <div id="exportMessage"></div>
        </div>
      </div>

      <!-- Report Summary -->
      <div class="panel" id="reportPanel" style="display: none;">
        <h3>Report Summary</h3>
        <div id="reportContent"></div>
      </div>
    </div>

    <script>
      const token = localStorage.getItem('siemToken');
      const user = JSON.parse(localStorage.getItem('siemUser') || '{}');

      if (!token) {
        window.location.href = '/login.html';
      }

      // Set date inputs to last 30 days by default
      const today = new Date();
      const thirtyDaysAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);

      document.getElementById('endDate').valueAsDate = today;
      document.getElementById('startDate').valueAsDate = thirtyDaysAgo;

      async function generateReport() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const msgDiv = document.getElementById('reportMessage');

        if (!startDate || !endDate) {
          msgDiv.innerHTML = '<div class="message error">Please select both dates</div>';
          return;
        }

        try {
          const response = await fetch(`/api/report/summary?startDate=${startDate}&endDate=${endDate}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await response.json();

          if (data.success) {
            const report = data.data;
            msgDiv.innerHTML = '<div class="message success">Report generated successfully</div>';

            const reportContent = document.getElementById('reportContent');
            reportContent.innerHTML = `
              <p><strong>Period:</strong> ${report.period}</p>
              <p><strong>Generated:</strong> ${new Date(report.generatedAt).toLocaleString()}</p>
              
              <h4 style="margin-top: 16px; margin-bottom: 12px;">Summary</h4>
              <div class="summary-grid">
                <div class="stat-box">
                  <div class="stat-label">Total Incidents</div>
                  <div class="stat-value">${report.summary.totalIncidents}</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">Total Alerts</div>
                  <div class="stat-value">${report.summary.totalAlerts}</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">Total Events</div>
                  <div class="stat-value">${report.summary.totalEvents}</div>
                </div>
                <div class="stat-box">
                  <div class="stat-label">Resolved</div>
                  <div class="stat-value">${report.resolvedIncidents}</div>
                </div>
              </div>

              <h4 style="margin-top: 16px; margin-bottom: 12px;">By Severity</h4>
              <div class="severity-box">
                <div class="severity-item">
                  <div class="severity-label">Critical</div>
                  <div class="severity-count critical">${report.bySeverity.critical}</div>
                </div>
                <div class="severity-item">
                  <div class="severity-label">High</div>
                  <div class="severity-count high">${report.bySeverity.high}</div>
                </div>
                <div class="severity-item">
                  <div class="severity-label">Medium</div>
                  <div class="severity-count medium">${report.bySeverity.medium}</div>
                </div>
                <div class="severity-item">
                  <div class="severity-label">Low</div>
                  <div class="severity-count low">${report.bySeverity.low}</div>
                </div>
              </div>

              <h4 style="margin-top: 16px; margin-bottom: 12px;">By Status</h4>
              <div style="background: rgba(59, 130, 246, 0.1); border-radius: 8px; padding: 12px;">
                <p><strong>New:</strong> ${report.byStatus.new}</p>
                <p><strong>Open:</strong> ${report.byStatus.open}</p>
                <p><strong>Investigating:</strong> ${report.byStatus.investigating}</p>
                <p><strong>Mitigated:</strong> ${report.byStatus.mitigated}</p>
                <p><strong>Resolved:</strong> ${report.byStatus.resolved}</p>
              </div>
            `;

            document.getElementById('reportPanel').style.display = 'block';
          } else {
            msgDiv.innerHTML = `<div class="message error">${data.message}</div>`;
          }
        } catch (error) {
          msgDiv.innerHTML = '<div class="message error">Failed to generate report</div>';
          console.error(error);
        }
      }

      async function exportIncidents() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const msgDiv = document.getElementById('exportMessage');

        try {
          const url = `/api/report/incidents/export?startDate=${startDate}&endDate=${endDate}`;
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (response.ok) {
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `incidents-${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(downloadUrl);
            msgDiv.innerHTML = '<div class="message success">Incidents exported successfully</div>';
          } else {
            msgDiv.innerHTML = '<div class="message error">Failed to export incidents</div>';
          }
        } catch (error) {
          msgDiv.innerHTML = '<div class="message error">Export failed</div>';
          console.error(error);
        }
      }

      async function exportAlerts() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const msgDiv = document.getElementById('exportMessage');

        try {
          const url = `/api/report/alerts/export?startDate=${startDate}&endDate=${endDate}`;
          const response = await fetch(url, {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (response.ok) {
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `alerts-${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(downloadUrl);
            msgDiv.innerHTML = '<div class="message success">Alerts exported successfully</div>';
          } else {
            msgDiv.innerHTML = '<div class="message error">Failed to export alerts</div>';
          }
        } catch (error) {
          msgDiv.innerHTML = '<div class="message error">Export failed</div>';
          console.error(error);
        }
      }

      async function exportEvents() {
        const msgDiv = document.getElementById('exportMessage');

        try {
          const response = await fetch('/api/export/events/export', {
            headers: { Authorization: `Bearer ${token}` }
          });

          if (response.ok) {
            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = `events-${Date.now()}.csv`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(downloadUrl);
            msgDiv.innerHTML = '<div class="message success">Events exported successfully</div>';
          } else {
            msgDiv.innerHTML = '<div class="message error">Failed to export events</div>';
          }
        } catch (error) {
          msgDiv.innerHTML = '<div class="message error">Export failed</div>';
          console.error(error);
        }
      }
    </script>
  </body>
</html>
