<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEIM Dashboard</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 20px;
      }
      .card h3 {
        margin: 0 0 10px;
        color: #94a3b8;
        font-size: 14px;
        text-transform: uppercase;
      }
      .card .value {
        font-size: 28px;
        font-weight: bold;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 20px;
      }
      .panel {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        padding: 16px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      th, td {
        padding: 10px 12px;
        border-bottom: 1px solid #1f2937;
        text-align: left;
      }
      th {
        color: #93c5fd;
      }
      .badge {
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
      }
      .critical { background: #7f1d1d; color: #fecaca; }
      .high { background: #7c2d12; color: #fdba74; }
      .medium { background: #78350f; color: #fcd34d; }
      .low { background: #14532d; color: #bbf7d0; }
      .open { background: #1e3a8a; color: #bfdbfe; }
      .investigating { background: #713f12; color: #fcd34d; }
      .resolved { background: #14532d; color: #bbf7d0; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>SEIM Dashboard</h1>
        <div id="status">Loading monitoring data...</div>
      </div>

      <div class="cards">
        <div class="card">
          <h3>Total Events</h3>
          <div id="totalEvents" class="value">0</div>
        </div>
        <div class="card">
          <h3>Critical Alerts</h3>
          <div id="criticalAlerts" class="value">0</div>
        </div>
        <div class="card">
          <h3>Open Incidents</h3>
          <div id="openIncidents" class="value">0</div>
        </div>
        <div class="card">
          <h3>Resolved Today</h3>
          <div id="resolvedToday" class="value">0</div>
        </div>
      </div>

      <div class="grid">
        <div class="panel">
          <h2>Recent Security Events</h2>
          <table>
            <thead>
              <tr>
                <th>Source</th>
                <th>Type</th>
                <th>Severity</th>
                <th>Message</th>
              </tr>
            </thead>
            <tbody id="eventsTable"></tbody>
          </table>
        </div>

        <div class="panel">
          <h2>Latest Alerts</h2>
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Severity</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="alertsTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      async function loadDashboard() {
        const resp = await fetch('/api/dashboard');
        const result = await resp.json();
        const data = result.data;

        document.getElementById('totalEvents').textContent = data.totalEvents;
        document.getElementById('criticalAlerts').textContent = data.criticalAlerts;
        document.getElementById('openIncidents').textContent = data.openIncidents;
        document.getElementById('resolvedToday').textContent = data.resolvedToday;
        document.getElementById('status').textContent = `Last updated: ${new Date(data.lastUpdated).toLocaleString()}`;
      }

      async function loadEvents() {
        const resp = await fetch('/api/events');
        const result = await resp.json();
        const rows = document.getElementById('eventsTable');
        rows.innerHTML = '';

        result.data.slice(0, 8).forEach(event => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${event.source}</td>
            <td>${event.eventType}</td>
            <td><span class="badge ${event.severity}">${event.severity}</span></td>
            <td>${event.message}</td>
          `;
          rows.appendChild(tr);
        });
      }

      async function loadAlerts() {
        const resp = await fetch('/api/alerts');
        const result = await resp.json();
        const rows = document.getElementById('alertsTable');
        rows.innerHTML = '';

        result.data.slice(0, 8).forEach(alert => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${alert.title}</td>
            <td><span class="badge ${alert.severity}">${alert.severity}</span></td>
            <td><span class="badge ${alert.status}">${alert.status}</span></td>
          `;
          rows.appendChild(tr);
        });
      }

      socket.on('new-event', () => {
        loadDashboard();
        loadEvents();
      });

      socket.on('new-alert', () => {
        loadDashboard();
        loadAlerts();
      });

      loadDashboard();
      loadEvents();
      loadAlerts();
    </script>
  </body>
</html>
