<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEIM Incidents</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111827;
        --line: #1f2937;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
        padding: 24px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .logout-btn {
        background: #ef4444;
        border: none;
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
      }
      .box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      th {
        color: #bfdbfe;
        font-weight: bold;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: bold;
      }
      .critical { background: rgba(239,68,68,0.2); color: #fca5a5; }
      .high { background: rgba(249,115,22,0.2); color: #fdba74; }
      .medium { background: rgba(245,158,11,0.2); color: #fcd34d; }
      .low { background: rgba(34,197,94,0.2); color: #86efac; }
      .new { background: rgba(59,130,246,0.2); color: #bfdbfe; }
      .open { background: rgba(249,115,22,0.2); color: #fdba74; }
      .investigating { background: rgba(245,158,11,0.2); color: #fcd34d; }
      .resolved { background: rgba(34,197,94,0.2); color: #86efac; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Incidents</h1>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>

      <div class="box">
        <table id="incidentTable">
          <thead>
            <tr>
              <th>Title</th>
              <th>Severity</th>
              <th>Status</th>
              <th>Assigned To</th>
              <th>Created</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <script>
      const token = localStorage.getItem('siemToken');

      if (!token) {
        window.location.href = '/login.html';
      }

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('siemToken');
        localStorage.removeItem('siemUser');
        window.location.href = '/login.html';
      });

      async function loadIncidents() {
        try {
          const response = await fetch('/api/incidents', {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await response.json();
          const tbody = document.querySelector('#incidentTable tbody');

          tbody.innerHTML = '';

          (data.data || []).forEach((incident) => {
            const tr = document.createElement('tr');
            const createdDate = new Date(incident.createdAt).toLocaleDateString();
            tr.innerHTML = `
              <td>${incident.title}</td>
              <td><span class="badge ${incident.severity}">${incident.severity}</span></td>
              <td><span class="badge ${incident.status}">${incident.status}</span></td>
              <td>${incident.assignedTo}</td>
              <td>${createdDate}</td>
            `;
            tbody.appendChild(tr);
          });
        } catch (error) {
          console.error('Failed to load incidents');
        }
      }

      loadIncidents();
      setInterval(loadIncidents, 30000);
    </script>
  </body>
</html>
