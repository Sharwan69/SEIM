<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incident Details - SEIM</title>
    <style>
      :root {
        --bg: #0b1220;
        --panel: #111827;
        --line: #1f2937;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --success: #22c55e;
        --warning: #facc15;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding: 24px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .back-btn {
        background: var(--muted);
        border: none;
        color: white;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
      }
      .back-btn:hover {
        background: #6b7280;
      }
      .grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
      }
      .panel h3 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 16px;
      }
      .info-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .info-label {
        color: var(--muted);
        font-size: 14px;
      }
      .info-value {
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
      }
      .badge.critical { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
      .badge.high { background: rgba(249, 115, 22, 0.2); color: #fdba74; }
      .badge.medium { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
      .badge.low { background: rgba(34, 197, 94, 0.2); color: #86efac; }
      .badge.new { background: rgba(59, 130, 246, 0.2); color: #bfdbfe; }
      .badge.open { background: rgba(59, 130, 246, 0.2); color: #bfdbfe; }
      .badge.investigating { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
      .badge.resolved { background: rgba(34, 197, 94, 0.2); color: #86efac; }
      .timeline {
        margin-top: 16px;
      }
      .timeline-item {
        display: flex;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
      }
      .timeline-dot {
        width: 12px;
        height: 12px;
        background: var(--primary);
        border-radius: 50%;
        margin-top: 4px;
        margin-right: 16px;
        flex-shrink: 0;
      }
      .timeline-content {
        flex: 1;
      }
      .timeline-time {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .timeline-message {
        font-size: 14px;
      }
      .note-box {
        background: rgba(59, 130, 246, 0.1);
        border-left: 3px solid var(--primary);
        padding: 12px;
        border-radius: 4px;
        margin-top: 8px;
      }
      textarea {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #0f172a;
        color: var(--text);
        font-family: inherit;
        margin-top: 8px;
        margin-bottom: 8px;
      }
      textarea:focus {
        outline: none;
        border-color: var(--primary);
      }
      button {
        padding: 10px 16px;
        border-radius: 8px;
        border: none;
        background: var(--primary);
        color: white;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
      }
      button:hover {
        background: #2563eb;
      }
      .related-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
      }
      th, td {
        padding: 8px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 13px;
      }
      th {
        background: rgba(59, 130, 246, 0.1);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <button class="back-btn" onclick="window.history.back()">← Back</button>
        <h1 id="incidentTitle">Incident Details</h1>
        <div></div>
      </div>

      <div class="grid">
        <!-- Main Content -->
        <div>
          <!-- Incident Details -->
          <div class="panel">
            <h3>Incident Details</h3>
            <div class="info-row">
              <span class="info-label">Title</span>
              <span class="info-value" id="detailTitle">-</span>
            </div>
            <div class="info-row">
              <span class="info-label">Severity</span>
              <span id="detailSeverity"><span class="badge">-</span></span>
            </div>
            <div class="info-row">
              <span class="info-label">Status</span>
              <span id="detailStatus"><span class="badge">-</span></span>
            </div>
            <div class="info-row">
              <span class="info-label">Source</span>
              <span class="info-value" id="detailSource">-</span>
            </div>
            <div class="info-row">
              <span class="info-label">Assigned To</span>
              <span class="info-value" id="detailAssigned">-</span>
            </div>
            <div class="info-row" style="border-bottom: none;">
              <span class="info-label">Created</span>
              <span class="info-value" id="detailCreated">-</span>
            </div>
          </div>

          <!-- Timeline & Notes -->
          <div class="panel" style="margin-top: 20px;">
            <h3>Timeline & Investigation Notes</h3>
            <div class="timeline" id="timeline"></div>
            
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line);">
              <h4 style="margin-bottom: 12px;">Add Investigation Note</h4>
              <textarea id="newNote" placeholder="Enter investigation notes..." rows="4"></textarea>
              <button onclick="addNote()">Add Note</button>
            </div>
          </div>
        </div>

        <!-- Sidebar -->
        <div>
          <!-- Related Alert -->
          <div class="panel" id="relatedAlertPanel" style="display: none;">
            <h3>Related Alert</h3>
            <div class="info-row">
              <span class="info-label">Title</span>
              <span class="info-value" id="alertTitle">-</span>
            </div>
            <div class="info-row">
              <span class="info-label">Severity</span>
              <span id="alertSeverity"><span class="badge">-</span></span>
            </div>
            <div class="info-row" style="border-bottom: none;">
              <span class="info-label">Status</span>
              <span id="alertStatus"><span class="badge">-</span></span>
            </div>
          </div>

          <!-- Related Events -->
          <div class="panel" style="margin-top: 20px;">
            <h3>Related Events</h3>
            <table class="related-table">
              <thead>
                <tr>
                  <th>Type</th>
                  <th>Severity</th>
                </tr>
              </thead>
              <tbody id="relatedEventsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script>
      const incidentId = new URLSearchParams(window.location.search).get('id');
      const token = localStorage.getItem('siemToken');

      if (!token) {
        window.location.href = '/login.html';
      }

      async function loadIncident() {
        try {
          const response = await fetch(`/api/incidents/${incidentId}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await response.json();

          if (data.success) {
            const incident = data.data.incident;
            const relatedAlert = data.data.relatedAlert;
            const relatedEvents = data.data.relatedEvents;
            const timeline = data.data.timeline;

            // Update incident details
            document.getElementById('incidentTitle').textContent = incident.title;
            document.getElementById('detailTitle').textContent = incident.title;
            document.getElementById('detailSeverity').innerHTML = `<span class="badge ${incident.severity}">${incident.severity}</span>`;
            document.getElementById('detailStatus').innerHTML = `<span class="badge ${incident.status}">${incident.status}</span>`;
            document.getElementById('detailSource').textContent = incident.source;
            document.getElementById('detailAssigned').textContent = incident.assignedTo;
            document.getElementById('detailCreated').textContent = new Date(incident.createdAt).toLocaleString();

            // Update related alert
            if (relatedAlert) {
              document.getElementById('relatedAlertPanel').style.display = 'block';
              document.getElementById('alertTitle').textContent = relatedAlert.title;
              document.getElementById('alertSeverity').innerHTML = `<span class="badge ${relatedAlert.severity}">${relatedAlert.severity}</span>`;
              document.getElementById('alertStatus').innerHTML = `<span class="badge ${relatedAlert.status}">${relatedAlert.status}</span>`;
            }

            // Update related events
            const eventsTable = document.getElementById('relatedEventsTable');
            eventsTable.innerHTML = '';
            (relatedEvents || []).forEach(event => {
              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>${event.eventType}</td>
                <td><span class="badge ${event.severity}">${event.severity}</span></td>
              `;
              eventsTable.appendChild(tr);
            });

            // Update timeline
            const timelineDiv = document.getElementById('timeline');
            timelineDiv.innerHTML = '';
            (timeline || []).forEach(item => {
              const timeStr = new Date(item.timestamp).toLocaleString();
              const div = document.createElement('div');
              div.className = 'timeline-item';
              div.innerHTML = `
                <div class="timeline-dot"></div>
                <div class="timeline-content">
                  <div class="timeline-time">${timeStr}</div>
                  <div class="timeline-message">${item.author ? `<strong>${item.author}:</strong> ` : ''} ${item.message}</div>
                  ${item.type === 'note' ? `<div class="note-box">${item.message}</div>` : ''}
                </div>
              `;
              timelineDiv.appendChild(div);
            });
          }
        } catch (error) {
          console.error('Failed to load incident:', error);
        }
      }

      async function addNote() {
        const message = document.getElementById('newNote').value.trim();
        if (!message) {
          alert('Please enter a note');
          return;
        }

        try {
          const response = await fetch(`/api/incidents/${incidentId}/notes`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`
            },
            body: JSON.stringify({ message })
          });

          const result = await response.json();
          if (result.success) {
            document.getElementById('newNote').value = '';
            loadIncident();
          } else {
            alert(result.message || 'Failed to add note');
          }
        } catch (error) {
          console.error('Failed to add note:', error);
          alert('Failed to add note');
        }
      }

      loadIncident();
    </script>
  </body>
</html>
